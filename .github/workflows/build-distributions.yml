name: Build OneBot distribution

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LOMU }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Read versions
        id: versions
        shell: bash
        run: |
          echo "core=$(grep '^lomuCoreVersion=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Test and build OneBot with plugins
        run: ./gradlew clean test :onebot:jar stageCommandPlugins verifyVersions --stacktrace

      - name: Package OneBot distribution
        shell: bash
        run: |
          package_dir="build/release/onebot-${{ steps.versions.outputs.core }}"
          mkdir -p "$package_dir/plugins"
          cp "onebot/build/libs/onebot-${{ steps.versions.outputs.core }}.jar" "$package_dir/"
          cp build/command-plugins/*.jar "$package_dir/plugins/"
          test -f "$package_dir/onebot-${{ steps.versions.outputs.core }}.jar"
          test "$(find "$package_dir/plugins" -maxdepth 1 -type f -name '*.jar' | wc -l)" -gt 0
          cd build/release
          zip -r "onebot-${{ steps.versions.outputs.core }}.zip" "onebot-${{ steps.versions.outputs.core }}"

      - name: Upload OneBot archive
        uses: actions/upload-artifact@v4
        with:
          name: onebot-${{ steps.versions.outputs.core }}
          path: build/release/onebot-${{ steps.versions.outputs.core }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LOMU }}
        run: |
          archive="build/release/onebot-${{ steps.versions.outputs.core }}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive" --generate-notes --title "$GITHUB_REF_NAME"
          fi
